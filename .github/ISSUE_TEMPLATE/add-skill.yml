name: Add Skill
description: Propose a community skill source for registry intake.
title: "[Skill] "
labels: ["source-intake"]
body:
  - type: markdown
    attributes:
      value: |
        Review the [intake requirements](https://github.com/majiayu000/claude-skill-registry-core/blob/main/CONTRIBUTING.md#requirements) before submitting. Commercial integrations are eligible when they provide a usable task workflow and disclose their dependencies and costs. Listing does not imply a maintainer recommendation.
  - type: input
    id: repo
    attributes:
      label: Repository
      description: GitHub owner/repo or full HTTPS URL.
      placeholder: owner/repo
    validations:
      required: true
  - type: input
    id: path
    attributes:
      label: Skill path
      description: Optional path to SKILL.md when it is not at the repository root.
      placeholder: skills/example/SKILL.md
  - type: input
    id: category
    attributes:
      label: Category
      description: Canonical category slug, such as development, testing, devops, design, security, data, or marketing.
      placeholder: development
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Start with material prerequisites such as an account, metered API, or remote MCP server, then briefly summarize what the skill does.
    validations:
      required: true
  - type: input
    id: license
    attributes:
      label: License
      description: License identifier and link to the license text covering SKILL.md and bundled files for redistribution.
      placeholder: MIT; https://github.com/owner/repo/blob/main/LICENSE
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and pricing
      description: List required tools, network services, accounts, and API keys for setup and normal use. Disclose metering, free-tier limits, and paid requirements with a current pricing link. State none where applicable.
    validations:
      required: true
  - type: textarea
    id: operations
    attributes:
      label: Setup and operations
      description: Describe local files or settings changed, credential storage, and data sent externally with its destination and purpose. Explain how explicit user authorization is obtained for account creation, subscriptions, payments, and shell-profile changes. State none where applicable. Do not include actual credentials or personal data.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: The source is public and installable.
          required: true
        - label: The skill does not contain secrets, tokens, or private endpoints.
          required: true
