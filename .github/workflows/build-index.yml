name: Build Search Index

on:
  # Manual trigger
  workflow_dispatch:
    inputs:
      allow_missing_security_report:
        description: "Allow building without the latest security-report artifact"
        required: false
        type: boolean
        default: false

  # Run when registry or site sources change
  push:
    branches: [main]
    paths:
      - 'registry.json'
      - 'scripts/build_search_index.py'
      - 'scripts/check_canonical_categories.py'
      - 'docs/**'
      - 'taxonomy/categories.yaml'
      - '.github/workflows/build-index.yml'

permissions:
  pages: write
  id-token: write
  actions: read

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate data repo config
        env:
          REGISTRY_DATA_REPO: ${{ vars.REGISTRY_DATA_REPO }}
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          if [ -z "$REGISTRY_DATA_REPO" ] || [ -z "$DATA_REPO_TOKEN" ]; then
            echo "Missing REGISTRY_DATA_REPO or DATA_REPO_TOKEN."
            exit 1
          fi

      - name: Checkout data repo to ./skills (archive source)
        uses: actions/checkout@v6
        with:
          repository: ${{ vars.REGISTRY_DATA_REPO }}
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: skills
          fetch-depth: 1

      - name: Download latest security report
        uses: actions/github-script@v9
        env:
          ALLOW_MISSING_SECURITY_REPORT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.allow_missing_security_report == 'true' }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const workflow_id = 'sync-data.yml';
            const allowMissing = process.env.ALLOW_MISSING_SECURITY_REPORT === 'true';
            const fs = require('fs');
            const path = require('path');
            const markerPath = path.join(process.env.GITHUB_WORKSPACE, 'security-report-missing.allowed');
            function handleMissing(message) {
              if (allowMissing) {
                core.warning(`${message} Continuing because allow_missing_security_report=true.`);
                fs.writeFileSync(markerPath, `${message}\n`);
                return;
              }
              core.setFailed(message);
            }
            const runs = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id,
              branch: 'main',
              status: 'success',
              per_page: 1
            });
            if (!runs.data.workflow_runs.length) {
              handleMissing('No successful sync-data runs found.');
              return;
            }
            const run_id = runs.data.workflow_runs[0].id;
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({ owner, repo, run_id });
            const artifact = artifacts.data.artifacts.find(a => a.name === 'security-report');
            if (!artifact) {
              handleMissing('No security-report artifact found.');
              return;
            }
            const download = await github.rest.actions.downloadArtifact({
              owner,
              repo,
              artifact_id: artifact.id,
              archive_format: 'zip'
            });
            const zipPath = path.join(process.env.GITHUB_WORKSPACE, 'security-report.zip');
            fs.writeFileSync(zipPath, Buffer.from(download.data));

      - name: Extract security report
        run: |
          if [ ! -f security-report.zip ]; then
            if [ -f security-report-missing.allowed ]; then
              echo "::warning::security-report artifact is missing by explicit workflow_dispatch override."
              exit 0
            fi
            echo "security-report.zip missing."
            exit 1
          fi
          unzip -o security-report.zip -d docs
          test -f docs/security-report.json
          ls -la docs/security-report.json

      - name: Build search index
        run: |
          echo "Building search index from archive tree (recursive)..."
          SECURITY_EVIDENCE_ARGS=()
          if [ -f security-report-missing.allowed ]; then
            SECURITY_EVIDENCE_ARGS+=(--allow-missing-security-evidence)
          fi
          python scripts/build_search_index.py --skills-dir skills --registry registry.json --output docs "${SECURITY_EVIDENCE_ARGS[@]}"

          echo ""
          echo "Index files generated:"
          ls -la docs/
          ls -la docs/categories/ || true

          echo ""
          echo "Index sizes:"
          du -sh docs/*.json docs/*.gz 2>/dev/null || true

      - name: Check generated artifact sizes
        run: |
          python scripts/check_generated_file_sizes.py \
            --root . \
            --include docs \
            --limit 12

      - name: Check category artifacts remain sharded
        run: python scripts/check_category_artifacts.py --categories-dir docs/categories

      - name: Check published categories are canonical
        run: python scripts/check_canonical_categories.py --docs-dir docs

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'docs'

  deploy-pages:
    if: github.ref == 'refs/heads/main'
    needs: build-index
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
