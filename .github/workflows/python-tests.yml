name: Python Test Health

on:
  pull_request:
    paths:
      - 'crawler/**'
      - 'scripts/**'
      - 'taxonomy/**'
      - 'tests/**'
      - 'docs/plan/**'
      - 'pyproject.toml'
      - 'requirements.txt'
      - '.github/workflows/python-tests.yml'
  push:
    branches: [main]
    paths:
      - 'crawler/**'
      - 'scripts/**'
      - 'taxonomy/**'
      - 'tests/**'
      - 'docs/plan/**'
      - 'pyproject.toml'
      - 'requirements.txt'
      - '.github/workflows/python-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov pytest-asyncio aiohttp requests pyyaml jsonschema 'diff-cover>=10,<11'

      - name: Run full pytest suite and emit coverage evidence
        run: python -m pytest -q --cov-report=xml:coverage.xml --cov-report=json:coverage.json

      - name: Enforce global, module, and critical-function coverage ratchet
        run: |
          python scripts/check_coverage_ratchet.py \
            --coverage coverage.json \
            --baseline coverage-baseline.json \
            --compare-ref origin/main

      - name: Enforce changed-line coverage
        run: diff-cover coverage.xml --compare-branch=origin/main --fail-under=80

      - name: Validate taxonomy governance
        run: python scripts/check_taxonomy_governance.py
