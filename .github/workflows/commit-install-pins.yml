name: Commit Install Pins

# Build Search Index stays read-only; it uploads the refreshed install-pins.json
# cache, and this workflow commits it after a successful run on main.
on:
  workflow_run:
    workflows: ["Build Search Index"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: read

jobs:
  commit-install-pins:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event != 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Download install pin cache
        uses: actions/download-artifact@v7
        with:
          name: install-pins
          path: ${{ runner.temp }}/install-pins
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Validate install pin cache
        run: |
          python3 - "$RUNNER_TEMP/install-pins/install-pins.json" <<'PY'
          import json, sys
          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          if payload.get("schema_version") != 1 or not isinstance(payload.get("pins"), dict):
              raise SystemExit("install-pins.json is not a schema_version 1 pins map")
          PY
          cp "$RUNNER_TEMP/install-pins/install-pins.json" install-pins.json

      - name: Commit & push install pins
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add install-pins.json
          if git diff --staged --quiet; then
            echo "Install pins unchanged"
            exit 0
          fi
          git commit -m "chore: refresh install pins $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Install pin push succeeded on attempt $attempt"
              exit 0
            fi
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Install pin rebase failed; aborting push."
              exit 1
            fi
          done
          echo "Install pin push failed after 3 attempts."
          exit 1
