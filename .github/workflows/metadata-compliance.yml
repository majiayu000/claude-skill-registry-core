name: Metadata Compliance

on:
  pull_request:
    paths:
      - "scripts/**"
      - "sources/community.json"
      - "schema/**"
      - "README.md"
      - "tests/**"
      - ".github/workflows/metadata-compliance.yml"
  workflow_dispatch:
    inputs:
      scan_scope:
        description: "Scan scope: changed (last commit) or full (all metadata)"
        required: false
        default: "changed"
      strict_mode:
        description: "Fail workflow on metadata compliance errors"
        required: false
        type: boolean
        default: false
      allow_missing_data_repo:
        description: "Allow advisory scan when the data repo checkout is unavailable"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  community-intake-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout core
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate community intake diff
        run: |
          python scripts/check_community_intake_diff.py \
            --base-ref "${{ github.event.pull_request.base.sha }}" \
            --head-ref HEAD \
            --path sources/community.json

  metadata-compliance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout core
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout data repo to ./skills
        continue-on-error: true
        uses: actions/checkout@v6
        with:
          repository: ${{ vars.REGISTRY_DATA_REPO }}
          token: ${{ secrets.DATA_REPO_TOKEN || github.token }}
          path: skills
          fetch-depth: 0

      - name: Ensure skills workspace exists
        env:
          ALLOW_MISSING_DATA_REPO: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.allow_missing_data_repo == 'true' }}
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          mkdir -p .tmp
          mkdir -p skills
          if [ ! -d skills/.git ]; then
            if [ "$ALLOW_MISSING_DATA_REPO" = "true" ] || [ "$IS_FORK_PR" = "true" ]; then
              echo "::warning::skills data repo not available in this context; metadata compliance will run with zero targets."
              echo "skills data repo unavailable" > .tmp/metadata-advisory-zero-targets
            else
              echo "skills data repo checkout failed; refusing to run metadata compliance with zero targets."
              exit 1
            fi
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema pyyaml

      - name: Build changed files list
        if: github.event_name == 'pull_request' || github.event.inputs.scan_scope != 'full'
        run: |
          mkdir -p .tmp
          if [ -d skills/.git ]; then
            {
              git -C skills diff --name-only --diff-filter=ACMR
              git -C skills ls-files --others --exclude-standard
            } | sed 's#^#skills/#' | sort -u > .tmp/changed-files.txt
          else
            echo "::warning::skills data repo unavailable; changed metadata target list is empty by explicit advisory path."
            : > .tmp/changed-files.txt
          fi
          echo "Changed skill files:"
          cat .tmp/changed-files.txt || true

      - name: Validate changed metadata
        if: github.event_name == 'pull_request' || github.event.inputs.scan_scope != 'full'
        run: |
          MODE_FLAG="--report-only"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.strict_mode }}" = "true" ]; then
            MODE_FLAG="--strict"
          fi
          python scripts/check_metadata_compliance.py \
            --skills-dir skills \
            --metadata-schema schema/metadata.schema.json \
            --file-list .tmp/changed-files.txt \
            --output-json metadata-compliance-report.json \
            --notices THIRD_PARTY_NOTICES.generated.md \
            $MODE_FLAG

      - name: Validate full metadata
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.scan_scope == 'full'
        run: |
          MODE_FLAG="--report-only"
          if [ "${{ github.event.inputs.strict_mode }}" = "true" ]; then
            MODE_FLAG="--strict"
          fi
          python scripts/check_metadata_compliance.py \
            --skills-dir skills \
            --metadata-schema schema/metadata.schema.json \
            --output-json metadata-compliance-report.json \
            --notices THIRD_PARTY_NOTICES.generated.md \
            $MODE_FLAG

      - name: Check README legal disclaimer
        run: |
          grep -q "Third-Party License & Attribution" README.md

      - name: Upload compliance artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: metadata-compliance
          path: |
            metadata-compliance-report.json
            THIRD_PARTY_NOTICES.generated.md
