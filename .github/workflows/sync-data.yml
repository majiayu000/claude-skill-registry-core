name: Sync Skills Archive (Data Repo) + Registry

on:
  schedule:
    - cron: "0 0 * * *"
    - cron: "30 2 * * 0"
  workflow_dispatch:
    inputs:
      full_scan:
        description: Run full discovery (slower)
        required: false
        type: boolean
        default: false
      skip_discovery:
        description: Skip GitHub discovery and rebuild from current sources only
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: sync-data-pipeline
  cancel-in-progress: true

jobs:
  prepare-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      data_sha: ${{ steps.refs.outputs.data_sha }}
      core_payload_ready: ${{ steps.prepare_payload.outputs.ready }}
      core_payload_count: ${{ steps.prepare_payload.outputs.count }}
    steps:
      - name: Checkout core
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate data repo config
        env:
          REGISTRY_DATA_REPO: ${{ vars.REGISTRY_DATA_REPO }}
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          if [ -z "$REGISTRY_DATA_REPO" ]; then
            echo "Missing repo variable: REGISTRY_DATA_REPO (e.g. yourname/claude-skill-registry-data)"
            exit 1
          fi
          if [ -z "$DATA_REPO_TOKEN" ]; then
            echo "Missing secret: DATA_REPO_TOKEN (PAT that can push to the data repo)"
            exit 1
          fi

      - name: Checkout data repo to ./skills
        uses: actions/checkout@v6
        with:
          repository: ${{ vars.REGISTRY_DATA_REPO }}
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: skills
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml aiohttp requests jsonschema

      - name: Resolve discovery profile
        id: discovery
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_FULL_SCAN: ${{ github.event.inputs.full_scan }}
          INPUT_SKIP_DISCOVERY: ${{ github.event.inputs.skip_discovery }}
        run: |
          profile="daily-bounded"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_SKIP_DISCOVERY" = "true" ]; then
            profile="manual-sources-only"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_FULL_SCAN" = "true" ]; then
            profile="full"
          elif [ "$EVENT_NAME" = "schedule" ] && [ "$EVENT_SCHEDULE" = "30 2 * * 0" ]; then
            profile="full"
          fi
          echo "profile=$profile" >> "$GITHUB_OUTPUT"
          echo "Discovery profile: $profile (event=$EVENT_NAME schedule=$EVENT_SCHEDULE full_scan=$INPUT_FULL_SCAN skip_discovery=$INPUT_SKIP_DISCOVERY)"

      - name: Discover new skills from GitHub (full)
        if: steps.discovery.outputs.profile == 'full'
        id: discover_full
        continue-on-error: true
        timeout-minutes: 180
        env:
          GITHUB_TOKEN: ${{ secrets.DISCOVERY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          echo "Running full discovery via GitHub API..."
          python scripts/discover_by_topic.py \
            --output skills/other \
            --json sources/discovered.json \
            --candidates-output sources/learning/discovery_candidates.jsonl \
            --priors-output sources/learning/discovery_priors.json 2>&1 | tee discover.log

      - name: Discover new skills from GitHub (daily bounded)
        if: steps.discovery.outputs.profile == 'daily-bounded'
        id: discover_daily
        continue-on-error: true
        timeout-minutes: 60
        env:
          GITHUB_TOKEN: ${{ secrets.DISCOVERY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          echo "Running bounded daily discovery..."
          python scripts/discover_by_topic.py \
            --output skills/other \
            --json sources/discovered.json \
            --candidates-output sources/learning/discovery_candidates.jsonl \
            --priors-output sources/learning/discovery_priors.json \
            --max-repos 300 \
            --max-topic-pages 2 \
            --skip-code-search \
            --request-delay 1.0 2>&1 | tee discover.log

      - name: Print discovery outcome
        if: always()
        env:
          PROFILE: ${{ steps.discovery.outputs.profile }}
          FULL_OUTCOME: ${{ steps.discover_full.outcome }}
          DAILY_OUTCOME: ${{ steps.discover_daily.outcome }}
        run: |
          if [ "$PROFILE" = "full" ]; then
            outcome="$FULL_OUTCOME"
          else
            outcome="$DAILY_OUTCOME"
          fi
          echo "Discovery profile: $PROFILE"
          echo "Discovery step outcome: ${outcome:-not-run}"

      - name: Rebuild registry from sources
        run: |
          echo "Rebuilding registry.json from current sources..."
          python scripts/sync_and_download.py --sync-only --skip-github-fallback

      - name: Download skills from registry (sharded)
        id: download_sharded
        shell: bash
        timeout-minutes: 240
        env:
          PROFILE: ${{ steps.discovery.outputs.profile }}
          GITHUB_TOKEN: ${{ secrets.DISCOVERY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ "$PROFILE" = "full" ]; then
            SHARD_COUNT=4
            MAX_PENDING=0
          else
            SHARD_COUNT=2
            MAX_PENDING=3000
          fi

          echo "Download profile: $PROFILE"
          echo "Shard count: $SHARD_COUNT"

          if [ "$MAX_PENDING" -gt 0 ]; then
            MAX_PENDING_PER_SHARD=$(( (MAX_PENDING + SHARD_COUNT - 1) / SHARD_COUNT ))
          else
            MAX_PENDING_PER_SHARD=0
          fi

          pids=""
          for idx in $(seq 0 $((SHARD_COUNT - 1))); do
            LOG_PATH="download_shard_${idx}.log"
            REPORT_PATH="failure_report_shard_${idx}.json"
            OBS_PATH="discovery_observations_shard_${idx}.jsonl"
            CMD="python scripts/sync_and_download.py --download-only --fail-on-empty-download --shard-count $SHARD_COUNT --shard-index $idx --disable-acquisition-manifest --failure-report $REPORT_PATH --observations-output $OBS_PATH"
            if [ "$MAX_PENDING_PER_SHARD" -gt 0 ]; then
              CMD="$CMD --max-pending $MAX_PENDING_PER_SHARD"
            fi
            echo "Starting shard $idx: $CMD"
            bash -lc "$CMD" > "$LOG_PATH" 2>&1 &
            pids="$pids $!"
          done

          failed=0
          for pid in $pids; do
            if ! wait "$pid"; then
              failed=1
            fi
          done

          echo "Sharded download logs:"
          ls -1 download_shard_*.log || true
          for f in download_shard_*.log; do
            echo "---- $f (tail) ----"
            tail -n 40 "$f" || true
          done

          python - <<'PY'
          import json
          from pathlib import Path

          paths = sorted(Path(".").glob("failure_report_shard_*.json"))
          merged = {
              "timestamp": "",
              "stats": {
                  "downloaded": 0,
                  "failed": 0,
                  "skipped": 0,
                  "url_attempts": 0,
                  "manifest_hits": 0,
                  "manifest_misses": 0,
              },
              "failure_reasons": {},
              "failures": {},
          }
          for p in paths:
              data = json.loads(p.read_text(encoding="utf-8"))
              merged["timestamp"] = data.get("timestamp", merged["timestamp"])
              stats = data.get("stats") or {}
              for key in (
                  "downloaded",
                  "failed",
                  "skipped",
                  "url_attempts",
                  "manifest_hits",
                  "manifest_misses",
              ):
                  value = stats.get(key, 0)
                  if isinstance(value, int):
                      merged["stats"][key] += value
              for k, v in (data.get("failure_reasons") or {}).items():
                  if isinstance(v, int):
                      merged["failure_reasons"][k] = merged["failure_reasons"].get(k, 0) + v
              for k, v in (data.get("failures") or {}).items():
                  if isinstance(v, list):
                      merged["failures"].setdefault(k, []).extend(v)
          Path("failure_report.json").write_text(
              json.dumps(merged, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          print("merged reports:", len(paths))
          print("merged stats:", merged["stats"])

          obs_paths = sorted(Path(".").glob("discovery_observations_shard_*.jsonl"))
          merged_obs_path = Path("sources/learning/discovery_observations.jsonl")
          merged_obs_path.parent.mkdir(parents=True, exist_ok=True)
          row_count = 0
          with merged_obs_path.open("w", encoding="utf-8") as out:
              for op in obs_paths:
                  for line in op.read_text(encoding="utf-8").splitlines():
                      line = line.strip()
                      if not line:
                          continue
                      out.write(line + "\n")
                      row_count += 1
          print("merged observation shards:", len(obs_paths))
          print("merged observations rows:", row_count)
          PY

          if [ "$failed" -ne 0 ]; then
            echo "::error::One or more shard downloads failed."
            exit 1
          fi

      - name: Upload download failure report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: download-failure-report
          path: failure_report.json
          if-no-files-found: ignore

      - name: Upload discovery learning data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: discovery-learning-data
          path: |
            sources/learning/discovery_candidates.jsonl
            sources/learning/discovery_observations.jsonl
            sources/learning/discovery_priors.json
          if-no-files-found: ignore

      - name: Resolve security scope
        id: security_scope
        env:
          PROFILE: ${{ steps.discovery.outputs.profile }}
        run: |
          FILE_LIST="$RUNNER_TEMP/security-scan-files.txt"
          : > "$FILE_LIST"

          if [ "$PROFILE" = "full" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "file_list=$FILE_LIST" >> "$GITHUB_OUTPUT"
            echo "changed_count=0" >> "$GITHUB_OUTPUT"
            echo "Security scope: full"
            exit 0
          fi

          {
            git -C skills diff --name-only --diff-filter=AM | grep '/SKILL.md$' || true
            git -C skills ls-files --others --exclude-standard | grep '/SKILL.md$' || true
          } | sort -u > "$FILE_LIST"

          COUNT=$(wc -l < "$FILE_LIST" | tr -d '[:space:]')
          if [ -z "$COUNT" ]; then
            COUNT=0
          fi

          echo "mode=daily-incremental" >> "$GITHUB_OUTPUT"
          echo "file_list=$FILE_LIST" >> "$GITHUB_OUTPUT"
          echo "changed_count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Security scope: daily-incremental ($COUNT files)"

      - name: Security scan (skills full)
        if: steps.security_scope.outputs.mode == 'full'
        id: security_full
        continue-on-error: true
        run: |
          echo "Running full security scan on skills..."
          python scripts/security_scanner.py skills/ --quiet --report-only --output security-report.json

      - name: Security scan (skills daily incremental)
        if: steps.security_scope.outputs.mode != 'full'
        id: security_daily
        continue-on-error: true
        run: |
          echo "Running incremental security scan on changed skills..."
          python scripts/security_scanner.py \
            skills/ \
            --quiet \
            --report-only \
            --output security-report.json \
            --file-list "${{ steps.security_scope.outputs.file_list }}"

      - name: Print security outcome
        if: always()
        env:
          MODE: ${{ steps.security_scope.outputs.mode }}
          CHANGED_COUNT: ${{ steps.security_scope.outputs.changed_count }}
          FULL_OUTCOME: ${{ steps.security_full.outcome }}
          DAILY_OUTCOME: ${{ steps.security_daily.outcome }}
        run: |
          if [ "$MODE" = "full" ]; then
            outcome="$FULL_OUTCOME"
          else
            outcome="$DAILY_OUTCOME"
          fi
          echo "Security mode: ${MODE:-unknown}"
          if [ "$MODE" != "full" ]; then
            echo "Security changed files: ${CHANGED_COUNT:-0}"
          fi
          echo "Security scan outcome: ${outcome:-not-run}"

      - name: Resolve metadata scope
        id: metadata_scope
        run: |
          FILE_LIST="$RUNNER_TEMP/metadata-scan-files.txt"
          : > "$FILE_LIST"

          {
            git -C skills diff --name-only --diff-filter=AM | grep -E '/(SKILL\.md|metadata\.json)$' || true
            git -C skills ls-files --others --exclude-standard | grep -E '/(SKILL\.md|metadata\.json)$' || true
          } | sed 's#^#skills/#' | sort -u > "$FILE_LIST"

          COUNT=$(wc -l < "$FILE_LIST" | tr -d '[:space:]')
          if [ -z "$COUNT" ]; then
            COUNT=0
          fi

          echo "file_list=$FILE_LIST" >> "$GITHUB_OUTPUT"
          echo "changed_count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Metadata scope changed files: $COUNT"

      - name: Metadata compliance scan (changed skills)
        run: |
          echo "Running metadata attribution/license compliance scan (advisory, non-blocking)..."
          python scripts/check_metadata_compliance.py \
            --skills-dir skills \
            --metadata-schema schema/metadata.schema.json \
            --file-list "${{ steps.metadata_scope.outputs.file_list }}" \
            --output-json metadata-compliance-report.json \
            --notices THIRD_PARTY_NOTICES.generated.md \
            --report-only

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-report
          path: security-report.json

      - name: Upload metadata compliance report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: metadata-compliance-report
          path: |
            metadata-compliance-report.json
            THIRD_PARTY_NOTICES.generated.md

      - name: Validate sync pipeline health
        env:
          PROFILE: ${{ steps.discovery.outputs.profile }}
          DISCOVER_FULL_OUTCOME: ${{ steps.discover_full.outcome }}
          DISCOVER_DAILY_OUTCOME: ${{ steps.discover_daily.outcome }}
          DOWNLOAD_OUTCOME: ${{ steps.download_sharded.outcome }}
          SECURITY_MODE: ${{ steps.security_scope.outputs.mode }}
          SECURITY_FULL_OUTCOME: ${{ steps.security_full.outcome }}
          SECURITY_DAILY_OUTCOME: ${{ steps.security_daily.outcome }}
        run: |
          if [ "$PROFILE" = "full" ]; then
            discovery_outcome="$DISCOVER_FULL_OUTCOME"
          else
            discovery_outcome="$DISCOVER_DAILY_OUTCOME"
          fi
          download_outcome="$DOWNLOAD_OUTCOME"

          if [ "$SECURITY_MODE" = "full" ]; then
            security_outcome="$SECURITY_FULL_OUTCOME"
          else
            security_outcome="$SECURITY_DAILY_OUTCOME"
          fi

          python scripts/check_sync_pipeline_health.py \
            --discovery-outcome "${discovery_outcome:-not-run}" \
            --download-outcome "${download_outcome:-not-run}" \
            --security-outcome "${security_outcome:-not-run}" \
            --security-report security-report.json \
            --require-security-report

      - name: Copy security report to docs
        run: |
          if [ -f security-report.json ]; then
            cp security-report.json docs/security-report.json
          else
            echo "::warning::security-report.json missing; skip docs copy."
          fi

      - name: Rebuild registry.json from archive
        run: |
          python scripts/rebuild_registry.py --skills-dir skills --registry registry.json --skip-categories

      - name: Build registry summary
        run: |
          python scripts/build_registry_summary.py \
            --registry registry.json \
            --plugins sources/plugins.json \
            --output registry_summary.json

      - name: Guard core artifact size before push
        run: |
          if [ ! -f registry.json ]; then
            echo "::error::registry.json not found before push."
            exit 1
          fi

          SIZE_BYTES=$(stat -c%s registry.json)
          LIMIT_BYTES=100000000
          SAFETY_LIMIT_BYTES=95000000

          echo "registry.json size: ${SIZE_BYTES} bytes"
          echo "GitHub hard limit: ${LIMIT_BYTES} bytes"
          echo "Configured safety limit: ${SAFETY_LIMIT_BYTES} bytes"

          if [ "$SIZE_BYTES" -gt "$SAFETY_LIMIT_BYTES" ]; then
            echo "::error::registry.json exceeds safety limit (${SIZE_BYTES} > ${SAFETY_LIMIT_BYTES})."
            echo "::error::Stopping before any push to avoid partial cross-repo updates."
            exit 1
          fi

      - name: Commit & push data repo changes
        run: |
          cd skills
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A

          if git diff --staged --quiet; then
            echo "No data repo changes"
          else
            git commit -m "chore: update skills archive $(date -u +%Y-%m-%d)"
            for attempt in 1 2 3; do
              if git push; then
                echo "Data push succeeded on attempt $attempt"
                break
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "Data push failed (attempt $attempt), rebasing and retrying..."
                git fetch origin main
                if ! git rebase origin/main; then
                  git rebase --abort || true
                  echo "Data rebase failed; aborting push."
                  exit 1
                fi
              else
                echo "Data push failed after 3 attempts."
                exit 1
              fi
            done
          fi

      - name: Capture data SHA
        id: refs
        run: |
          echo "data_sha=$(git -C skills rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Package core changes for finalize stage
        id: prepare_payload
        run: |
          ALL_CHANGED="$RUNNER_TEMP/core-all-changed.txt"
          PAYLOAD_FILES="$RUNNER_TEMP/core-files.txt"
          PAYLOAD_DIR="$RUNNER_TEMP/core-sync-payload"

          mkdir -p "$PAYLOAD_DIR/files"
          : > "$PAYLOAD_FILES"

          {
            git diff --name-only
            git ls-files --others --exclude-standard
          } | sort -u > "$ALL_CHANGED"

          while IFS= read -r file; do
            case "$file" in
              registry.json|registry_summary.json|CHANGELOG.md|README.md|SECURITY.md|LICENSE|THIRD_PARTY_NOTICES.md|.github/workflows/sync-data.yml|.github/workflows/metadata-compliance.yml|sources/*|scripts/*|schema/*)
                if [ -f "$file" ]; then
                  echo "$file" >> "$PAYLOAD_FILES"
                  mkdir -p "$PAYLOAD_DIR/files/$(dirname "$file")"
                  cp -a "$file" "$PAYLOAD_DIR/files/$file"
                fi
                ;;
            esac
          done < "$ALL_CHANGED"

          COUNT=$(wc -l < "$PAYLOAD_FILES" | tr -d '[:space:]')
          if [ -z "$COUNT" ]; then
            COUNT=0
          fi

          cp "$PAYLOAD_FILES" "$PAYLOAD_DIR/core-files.txt"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "payload_dir=$PAYLOAD_DIR" >> "$GITHUB_OUTPUT"

          if [ "$COUNT" -gt 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Core payload prepared with $COUNT files."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No core files changed; payload skipped."
          fi

      - name: Upload core sync payload
        if: steps.prepare_payload.outputs.ready == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: core-sync-payload
          path: ${{ steps.prepare_payload.outputs.payload_dir }}

  finalize-core-and-dispatch:
    needs: prepare-sync
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout core
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download core sync payload
        if: needs.prepare-sync.outputs.core_payload_ready == 'true'
        uses: actions/download-artifact@v8
        with:
          name: core-sync-payload
          path: ${{ runner.temp }}/core-sync-payload

      - name: Apply core sync payload
        if: needs.prepare-sync.outputs.core_payload_ready == 'true'
        run: |
          PAYLOAD_ROOT="${{ runner.temp }}/core-sync-payload"
          FILE_LIST="$PAYLOAD_ROOT/core-files.txt"

          if [ ! -f "$FILE_LIST" ]; then
            echo "::error::Missing payload file list: $FILE_LIST"
            exit 1
          fi

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            src="$PAYLOAD_ROOT/files/$file"
            if [ ! -f "$src" ]; then
              echo "::error::Missing payload file: $src"
              exit 1
            fi
            mkdir -p "$(dirname "$file")"
            cp -a "$src" "$file"
          done < "$FILE_LIST"

          echo "Applied core payload with $(wc -l < "$FILE_LIST" | tr -d '[:space:]') files."

      - name: Commit & push core metadata changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add registry.json registry_summary.json sources/ CHANGELOG.md scripts/ schema/ README.md SECURITY.md LICENSE THIRD_PARTY_NOTICES.md .github/workflows/sync-data.yml .github/workflows/metadata-compliance.yml

          if git diff --staged --quiet; then
            echo "No core changes"
          else
            COUNT=$(python3 -c "import json; print(json.load(open('registry_summary.json')).get('total_count', 0))")
            git commit -m "chore: sync registry ($COUNT skills) $(date -u +%Y-%m-%d)"
            for attempt in 1 2 3; do
              if git push; then
                echo "Core push succeeded on attempt $attempt"
                break
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "Core push failed (attempt $attempt), rebasing and retrying..."
                git fetch origin main
                if ! git rebase origin/main; then
                  git rebase --abort || true
                  echo "Core rebase failed; aborting push."
                  exit 1
                fi
              else
                echo "Core push failed after 3 attempts."
                exit 1
              fi
            done
          fi

      - name: Capture source SHAs
        id: refs
        env:
          DATA_SHA: ${{ needs.prepare-sync.outputs.data_sha }}
        run: |
          echo "core_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "data_sha=$DATA_SHA" >> "$GITHUB_OUTPUT"

      - name: Validate main publish config
        id: maincfg
        env:
          REGISTRY_MAIN_REPO: ${{ vars.REGISTRY_MAIN_REPO }}
          MAIN_REPO_TOKEN: ${{ secrets.MAIN_REPO_TOKEN }}
        run: |
          if [ -z "$REGISTRY_MAIN_REPO" ]; then
            echo "::warning::Missing repo variable REGISTRY_MAIN_REPO; skipping main publish dispatch."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$MAIN_REPO_TOKEN" ]; then
            echo "::warning::Missing secret MAIN_REPO_TOKEN; skipping main publish dispatch."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch main publish workflow
        if: steps.maincfg.outputs.ready == 'true'
        env:
          REGISTRY_MAIN_REPO: ${{ vars.REGISTRY_MAIN_REPO }}
          MAIN_REPO_TOKEN: ${{ secrets.MAIN_REPO_TOKEN }}
          CORE_REPO: ${{ github.repository }}
          CORE_SHA: ${{ steps.refs.outputs.core_sha }}
          DATA_REPO: ${{ vars.REGISTRY_DATA_REPO }}
          DATA_SHA: ${{ steps.refs.outputs.data_sha }}
        run: |
          PAYLOAD=$(cat <<JSON
          {"event_type":"publish_from_core","client_payload":{"core_repo":"$CORE_REPO","core_sha":"$CORE_SHA","data_repo":"$DATA_REPO","data_sha":"$DATA_SHA"}}
          JSON
          )
          curl --fail-with-body -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $MAIN_REPO_TOKEN" \
            "https://api.github.com/repos/$REGISTRY_MAIN_REPO/dispatches" \
            -d "$PAYLOAD"
          echo "Dispatched publish: $REGISTRY_MAIN_REPO (core=$CORE_SHA data=$DATA_SHA)"

      - name: Dispatch build-index to refresh Pages
        if: steps.maincfg.outputs.ready == 'true'
        env:
          MAIN_REPO_TOKEN: ${{ secrets.MAIN_REPO_TOKEN }}
        run: |
          curl --fail-with-body -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $MAIN_REPO_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/build-index.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "Dispatched build-index for Pages refresh"
