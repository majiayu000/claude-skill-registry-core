name: Sync Skills Archive (Data Repo) + Registry

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
    # Run a full discovery weekly on Sunday
    - cron: '30 2 * * 0'
  workflow_dispatch:
    inputs:
      full_scan:
        description: Run full discovery (slower)
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sync-data-pipeline
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout core
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate data repo config
        env:
          REGISTRY_DATA_REPO: ${{ vars.REGISTRY_DATA_REPO }}
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          if [ -z "$REGISTRY_DATA_REPO" ]; then
            echo "Missing repo variable: REGISTRY_DATA_REPO (e.g. yourname/claude-skill-registry-data)"
            exit 1
          fi
          if [ -z "$DATA_REPO_TOKEN" ]; then
            echo "Missing secret: DATA_REPO_TOKEN (PAT that can push to the data repo)"
            exit 1
          fi

      - name: Checkout data repo to ./skills
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.REGISTRY_DATA_REPO }}
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: skills
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml aiohttp requests jsonschema

      - name: Resolve discovery profile
        id: discovery
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_FULL_SCAN: ${{ github.event.inputs.full_scan }}
        run: |
          profile="daily-bounded"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_FULL_SCAN" = "true" ]; then
            profile="full"
          elif [ "$EVENT_NAME" = "schedule" ] && [ "$EVENT_SCHEDULE" = "30 2 * * 0" ]; then
            profile="full"
          fi
          echo "profile=$profile" >> "$GITHUB_OUTPUT"
          echo "Discovery profile: $profile (event=$EVENT_NAME schedule=$EVENT_SCHEDULE full_scan=$INPUT_FULL_SCAN)"

      - name: Discover new skills from GitHub (full)
        if: steps.discovery.outputs.profile == 'full'
        id: discover_full
        continue-on-error: true
        timeout-minutes: 180
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🔍 Running full discovery via GitHub API..."
          python scripts/discover_by_topic.py --output skills/other --json sources/discovered.json 2>&1 | tee discover.log

      - name: Discover new skills from GitHub (daily bounded)
        if: steps.discovery.outputs.profile != 'full'
        id: discover_daily
        continue-on-error: true
        timeout-minutes: 60
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🔍 Running bounded daily discovery..."
          python scripts/discover_by_topic.py \
            --output skills/other \
            --json sources/discovered.json \
            --max-repos 300 \
            --max-topic-pages 2 \
            --skip-code-search \
            --request-delay 1.0 2>&1 | tee discover.log

      - name: Print discovery outcome
        if: always()
        env:
          PROFILE: ${{ steps.discovery.outputs.profile }}
          FULL_OUTCOME: ${{ steps.discover_full.outcome }}
          DAILY_OUTCOME: ${{ steps.discover_daily.outcome }}
        run: |
          if [ "$PROFILE" = "full" ]; then
            outcome="$FULL_OUTCOME"
          else
            outcome="$DAILY_OUTCOME"
          fi
          echo "Discovery profile: $PROFILE"
          echo "Discovery step outcome: ${outcome:-not-run}"

      - name: Download skills from registry (full)
        if: steps.discovery.outputs.profile == 'full'
        id: download_full
        continue-on-error: true
        timeout-minutes: 240
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "⬇️ Downloading skills from existing registry (full mode)..."
          python scripts/sync_and_download.py --download-only 2>&1 | tee download.log

      - name: Download skills from registry (daily bounded)
        if: steps.discovery.outputs.profile != 'full'
        id: download_daily
        continue-on-error: true
        timeout-minutes: 120
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "⬇️ Downloading bounded set from registry (daily mode)..."
          python scripts/sync_and_download.py --download-only --max-pending 3000 2>&1 | tee download.log

      - name: Print download outcome
        if: always()
        env:
          PROFILE: ${{ steps.discovery.outputs.profile }}
          FULL_OUTCOME: ${{ steps.download_full.outcome }}
          DAILY_OUTCOME: ${{ steps.download_daily.outcome }}
        run: |
          if [ "$PROFILE" = "full" ]; then
            outcome="$FULL_OUTCOME"
          else
            outcome="$DAILY_OUTCOME"
          fi
          echo "Download profile: $PROFILE"
          echo "Download step outcome: ${outcome:-not-run}"

      - name: Resolve security scope
        id: security_scope
        env:
          PROFILE: ${{ steps.discovery.outputs.profile }}
        run: |
          FILE_LIST="$RUNNER_TEMP/security-scan-files.txt"
          : > "$FILE_LIST"

          if [ "$PROFILE" = "full" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "file_list=$FILE_LIST" >> "$GITHUB_OUTPUT"
            echo "changed_count=0" >> "$GITHUB_OUTPUT"
            echo "Security scope: full"
            exit 0
          fi

          {
            git -C skills diff --name-only --diff-filter=AM | grep '/SKILL.md$' || true
            git -C skills ls-files --others --exclude-standard | grep '/SKILL.md$' || true
          } | sort -u > "$FILE_LIST"

          COUNT=$(wc -l < "$FILE_LIST" | tr -d '[:space:]')
          if [ -z "$COUNT" ]; then
            COUNT=0
          fi

          echo "mode=daily-incremental" >> "$GITHUB_OUTPUT"
          echo "file_list=$FILE_LIST" >> "$GITHUB_OUTPUT"
          echo "changed_count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Security scope: daily-incremental ($COUNT files)"

      - name: Security scan (skills full)
        if: steps.security_scope.outputs.mode == 'full'
        id: security_full
        continue-on-error: true
        run: |
          echo "🔒 Running full security scan on skills..."
          python scripts/security_scanner.py skills/ --quiet --report-only --output security-report.json

      - name: Security scan (skills daily incremental)
        if: steps.security_scope.outputs.mode != 'full'
        id: security_daily
        continue-on-error: true
        run: |
          echo "🔒 Running incremental security scan on changed skills..."
          python scripts/security_scanner.py \
            skills/ \
            --quiet \
            --report-only \
            --output security-report.json \
            --file-list "${{ steps.security_scope.outputs.file_list }}"

      - name: Print security outcome
        if: always()
        env:
          MODE: ${{ steps.security_scope.outputs.mode }}
          CHANGED_COUNT: ${{ steps.security_scope.outputs.changed_count }}
          FULL_OUTCOME: ${{ steps.security_full.outcome }}
          DAILY_OUTCOME: ${{ steps.security_daily.outcome }}
        run: |
          if [ "$MODE" = "full" ]; then
            outcome="$FULL_OUTCOME"
          else
            outcome="$DAILY_OUTCOME"
          fi
          echo "Security mode: ${MODE:-unknown}"
          if [ "$MODE" != "full" ]; then
            echo "Security changed files: ${CHANGED_COUNT:-0}"
          fi
          echo "Security scan outcome: ${outcome:-not-run}"

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: security-report.json

      - name: Copy security report to docs
        run: |
          if [ -f security-report.json ]; then
            cp security-report.json docs/security-report.json
          else
            echo "::warning::security-report.json missing; skip docs copy."
          fi

      - name: Rebuild registry.json from archive
        run: |
          python scripts/rebuild_registry.py --skills-dir skills --registry registry.json --skip-categories

      - name: Commit & push data repo changes
        run: |
          cd skills
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A

          if git diff --staged --quiet; then
            echo "No data repo changes"
          else
            git commit -m "chore: update skills archive $(date -u +%Y-%m-%d)"
            for attempt in 1 2 3; do
              if git push; then
                echo "Data push succeeded on attempt $attempt"
                break
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "Data push failed (attempt $attempt), rebasing and retrying..."
                git fetch origin main
                if ! git rebase origin/main; then
                  git rebase --abort || true
                  echo "Data rebase failed; aborting push."
                  exit 1
                fi
              else
                echo "Data push failed after 3 attempts."
                exit 1
              fi
            done
          fi

      - name: Commit & push core metadata changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add registry.json sources/ CHANGELOG.md scripts/ schema/ README.md SECURITY.md LICENSE .github/workflows/sync-data.yml

          if git diff --staged --quiet; then
            echo "No core changes"
          else
            COUNT=$(python3 -c "import json; print(json.load(open('registry.json')).get('total_count', 0))")
            git commit -m "chore: sync registry ($COUNT skills) $(date -u +%Y-%m-%d)"
            for attempt in 1 2 3; do
              if git push; then
                echo "Core push succeeded on attempt $attempt"
                break
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "Core push failed (attempt $attempt), rebasing and retrying..."
                git fetch origin main
                if ! git rebase origin/main; then
                  git rebase --abort || true
                  echo "Core rebase failed; aborting push."
                  exit 1
                fi
              else
                echo "Core push failed after 3 attempts."
                exit 1
              fi
            done
          fi

      - name: Capture source SHAs
        id: refs
        run: |
          echo "core_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "data_sha=$(git -C skills rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate main publish config
        id: maincfg
        env:
          REGISTRY_MAIN_REPO: ${{ vars.REGISTRY_MAIN_REPO }}
          MAIN_REPO_TOKEN: ${{ secrets.MAIN_REPO_TOKEN }}
        run: |
          if [ -z "$REGISTRY_MAIN_REPO" ]; then
            echo "::warning::Missing repo variable REGISTRY_MAIN_REPO; skipping main publish dispatch."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$MAIN_REPO_TOKEN" ]; then
            echo "::warning::Missing secret MAIN_REPO_TOKEN; skipping main publish dispatch."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch main publish workflow
        if: steps.maincfg.outputs.ready == 'true'
        env:
          REGISTRY_MAIN_REPO: ${{ vars.REGISTRY_MAIN_REPO }}
          MAIN_REPO_TOKEN: ${{ secrets.MAIN_REPO_TOKEN }}
          CORE_REPO: ${{ github.repository }}
          CORE_SHA: ${{ steps.refs.outputs.core_sha }}
          DATA_REPO: ${{ vars.REGISTRY_DATA_REPO }}
          DATA_SHA: ${{ steps.refs.outputs.data_sha }}
        run: |
          PAYLOAD=$(cat <<JSON
          {"event_type":"publish_from_core","client_payload":{"core_repo":"$CORE_REPO","core_sha":"$CORE_SHA","data_repo":"$DATA_REPO","data_sha":"$DATA_SHA"}}
          JSON
          )
          curl --fail-with-body -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $MAIN_REPO_TOKEN" \
            "https://api.github.com/repos/$REGISTRY_MAIN_REPO/dispatches" \
            -d "$PAYLOAD"
          echo "Dispatched publish: $REGISTRY_MAIN_REPO (core=$CORE_SHA data=$DATA_SHA)"
