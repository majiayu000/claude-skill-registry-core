name: Sync Skills Archive (Data Repo) + Registry

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
    # Run a full discovery weekly on Sunday
    - cron: '30 2 * * 0'
  workflow_dispatch:
    inputs:
      full_scan:
        description: Run full discovery (slower)
        required: false
        type: boolean
        default: false
      skip_discovery:
        description: Skip GitHub discovery and rebuild from current sources only
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sync-data-pipeline
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Require main branch authority
        env:
          GITHUB_REF_VALUE: ${{ github.ref }}
        run: |
          if [ "$GITHUB_REF_VALUE" != "refs/heads/main" ]; then
            echo "sync-data may only run from refs/heads/main (got $GITHUB_REF_VALUE)."
            exit 1
          fi

      - name: Validate target repositories and write permissions
        env:
          CORE_REPO: ${{ github.repository }}
          REGISTRY_DATA_REPO: ${{ vars.REGISTRY_DATA_REPO }}
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          REGISTRY_MAIN_REPO: ${{ vars.REGISTRY_MAIN_REPO }}
          MAIN_REPO_TOKEN: ${{ secrets.MAIN_REPO_TOKEN }}
        run: |
          set -euo pipefail
          for name in REGISTRY_DATA_REPO DATA_REPO_TOKEN REGISTRY_MAIN_REPO MAIN_REPO_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required sync-data configuration: $name"
              exit 1
            fi
          done

          python - <<'PY'
          import os
          import re

          repo_pattern = re.compile(r"^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$")
          repos = {
              "CORE_REPO": os.environ["CORE_REPO"],
              "REGISTRY_DATA_REPO": os.environ["REGISTRY_DATA_REPO"],
              "REGISTRY_MAIN_REPO": os.environ["REGISTRY_MAIN_REPO"],
          }
          invalid = [name for name, value in repos.items() if not repo_pattern.fullmatch(value)]
          if invalid:
              raise SystemExit(f"Invalid owner/name repository configuration: {', '.join(invalid)}")
          if len(set(repos.values())) != len(repos):
              raise SystemExit("Core, data, and main repositories must be distinct")
          PY

          validate_repo() {
            local repo="$1"
            local token="$2"
            local response="$RUNNER_TEMP/repo-$3.json"
            curl --silent --show-error --fail-with-body \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $token" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              --output "$response" \
              "https://api.github.com/repos/$repo"
            REPO_RESPONSE="$response" REPO_NAME="$repo" python - <<'PY'
          import json
          import os

          with open(os.environ["REPO_RESPONSE"], encoding="utf-8") as handle:
              response = json.load(handle)
          repo = os.environ["REPO_NAME"]
          if response.get("full_name", "").casefold() != repo.casefold():
              raise SystemExit(f"Repository API identity mismatch for {repo}")
          if response.get("default_branch") != "main":
              raise SystemExit(f"Repository {repo} default branch must be main")
          if response.get("permissions", {}).get("push") is not True:
              raise SystemExit(f"Credential does not have push permission for {repo}")
          PY
          }

          validate_repo "$REGISTRY_DATA_REPO" "$DATA_REPO_TOKEN" data
          validate_repo "$REGISTRY_MAIN_REPO" "$MAIN_REPO_TOKEN" main

      - name: Download replay handoff
        if: github.run_attempt > 1
        uses: actions/download-artifact@v7
        with:
          # No run-id/repository override: restore only from this workflow run.
          name: sync-publish-handoff
          path: replay-handoff

      - name: Validate replay handoff before mutation boundary
        if: github.run_attempt > 1
        env:
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_CORE_REPO: ${{ github.repository }}
          EXPECTED_DATA_REPO: ${{ vars.REGISTRY_DATA_REPO }}
          EXPECTED_TARGET_REPO: ${{ vars.REGISTRY_MAIN_REPO }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          root = Path("replay-handoff")
          payload_path = root / "publish-dispatch-payload.json"
          evidence_path = root / "publish-dispatch-evidence.json"
          if not payload_path.is_file() or not evidence_path.is_file():
              raise SystemExit("Rerun requires both handoff files from the original attempt")

          payload_bytes = payload_path.read_bytes()
          payload = json.loads(payload_bytes)
          evidence = json.loads(evidence_path.read_text(encoding="utf-8"))
          payload_keys = {"event_type", "client_payload"}
          client_keys = {"core_repo", "core_sha", "data_repo", "data_sha"}
          evidence_keys = {
              "schema_version", "run_id", "run_attempt", "target_repo", "core_repo",
              "core_sha", "data_repo", "data_sha", "event_type", "payload_sha256",
          }
          if set(payload) != payload_keys or set(payload.get("client_payload", {})) != client_keys:
              raise SystemExit("Replay payload has unexpected or missing fields")
          if set(evidence) != evidence_keys:
              raise SystemExit("Replay evidence has unexpected or missing fields")
          expected = {
              "schema_version": 1,
              "run_id": os.environ["EXPECTED_RUN_ID"],
              "run_attempt": 1,
              "target_repo": os.environ["EXPECTED_TARGET_REPO"],
              "core_repo": os.environ["EXPECTED_CORE_REPO"],
              "data_repo": os.environ["EXPECTED_DATA_REPO"],
              "event_type": "publish_from_core",
          }
          for key, value in expected.items():
              if evidence.get(key) != value:
                  raise SystemExit(f"Replay evidence mismatch: {key}")
          client = payload["client_payload"]
          for key in client_keys:
              if client.get(key) != evidence.get(key):
                  raise SystemExit(f"Replay payload/evidence mismatch: {key}")
          if payload["event_type"] != evidence["event_type"]:
              raise SystemExit("Replay event_type mismatch")
          if not re.fullmatch(r"[0-9a-f]{40}", evidence["core_sha"]):
              raise SystemExit("Invalid replay core SHA")
          if not re.fullmatch(r"[0-9a-f]{40}", evidence["data_sha"]):
              raise SystemExit("Invalid replay data SHA")
          digest = hashlib.sha256(payload_bytes).hexdigest()
          if digest != evidence["payload_sha256"]:
              raise SystemExit("Replay payload hash mismatch")
          print(f"Validated replay handoff for run {evidence['run_id']} ({digest})")
          PY

  sync:
    needs: preflight
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout core
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout data repo to ./skills
        uses: actions/checkout@v6
        with:
          repository: ${{ vars.REGISTRY_DATA_REPO }}
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: skills
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml aiohttp requests jsonschema

      - name: Install ClamAV
        run: |
          sudo apt-get update
          sudo apt-get install -y clamav clamav-freshclam
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam
          clamscan --version

      - name: Resolve discovery profile
        id: discovery
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_FULL_SCAN: ${{ github.event.inputs.full_scan }}
          INPUT_SKIP_DISCOVERY: ${{ github.event.inputs.skip_discovery }}
        run: |
          profile="daily-bounded"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_SKIP_DISCOVERY" = "true" ]; then
            profile="manual-sources-only"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_FULL_SCAN" = "true" ]; then
            profile="full"
          elif [ "$EVENT_NAME" = "schedule" ] && [ "$EVENT_SCHEDULE" = "30 2 * * 0" ]; then
            profile="full"
          fi
          echo "profile=$profile" >> "$GITHUB_OUTPUT"
          echo "Discovery profile: $profile (event=$EVENT_NAME schedule=$EVENT_SCHEDULE full_scan=$INPUT_FULL_SCAN skip_discovery=$INPUT_SKIP_DISCOVERY)"

      - name: Clean CI archive leftovers before discovery
        run: python scripts/sync_and_download.py --cleanup-ci-untracked-archive-files-only

      - name: Discover new skills from GitHub (full)
        if: steps.discovery.outputs.profile == 'full'
        id: discover_full
        continue-on-error: true
        timeout-minutes: 180
        env:
          GITHUB_TOKEN: ${{ secrets.DISCOVERY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          echo "🔍 Running full discovery via GitHub API..."
          python scripts/discover_by_topic.py \
            --output skills \
            --json sources/discovered.json \
            --candidates-output sources/learning/discovery_candidates.jsonl \
            --priors-output sources/learning/discovery_priors.json 2>&1 | tee discover.log

      - name: Discover new skills from GitHub (daily bounded)
        if: steps.discovery.outputs.profile == 'daily-bounded'
        id: discover_daily
        continue-on-error: true
        timeout-minutes: 60
        env:
          GITHUB_TOKEN: ${{ secrets.DISCOVERY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          echo "🔍 Running bounded daily discovery..."
          python scripts/discover_by_topic.py \
            --output skills \
            --json sources/discovered.json \
            --candidates-output sources/learning/discovery_candidates.jsonl \
            --priors-output sources/learning/discovery_priors.json \
            --max-repos 300 \
            --max-topic-pages 2 \
            --skip-code-search \
            --request-delay 1.0 2>&1 | tee discover.log

      - name: Print discovery outcome
        if: always()
        env:
          PROFILE: ${{ steps.discovery.outputs.profile }}
          FULL_OUTCOME: ${{ steps.discover_full.outcome }}
          DAILY_OUTCOME: ${{ steps.discover_daily.outcome }}
        run: |
          if [ "$PROFILE" = "full" ]; then
            outcome="$FULL_OUTCOME"
          else
            outcome="$DAILY_OUTCOME"
          fi
          echo "Discovery profile: $PROFILE"
          echo "Discovery step outcome: ${outcome:-not-run}"

      - name: Validate source categories
        run: python scripts/validate_sources.py --sources-dir sources

      - name: Rebuild registry from sources
        run: |
          echo "🧱 Rebuilding registry.json from current sources..."
          python scripts/sync_and_download.py --sync-only --skip-github-fallback

      - name: Download skills from registry (full)
        if: steps.discovery.outputs.profile == 'full'
        id: download_full
        shell: bash
        timeout-minutes: 240
        env:
          GITHUB_TOKEN: ${{ secrets.DISCOVERY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          echo "⬇️ Downloading skills from existing registry (full mode)..."
          python scripts/sync_and_download.py \
            --download-only \
            --skip-ci-untracked-cleanup \
            --fail-on-empty-download \
            --observations-output sources/learning/discovery_observations.jsonl \
            --learning-priors sources/learning/discovery_priors.json 2>&1 | tee download.log

      - name: Download skills from registry (daily bounded)
        if: steps.discovery.outputs.profile != 'full'
        id: download_daily
        shell: bash
        timeout-minutes: 120
        env:
          GITHUB_TOKEN: ${{ secrets.DISCOVERY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          echo "⬇️ Downloading bounded set from registry (daily mode)..."
          python scripts/sync_and_download.py \
            --download-only \
            --max-pending 3000 \
            --skip-ci-untracked-cleanup \
            --fail-on-empty-download \
            --observations-output sources/learning/discovery_observations.jsonl \
            --learning-priors sources/learning/discovery_priors.json 2>&1 | tee download.log

      - name: Print download outcome
        if: always()
        env:
          PROFILE: ${{ steps.discovery.outputs.profile }}
          FULL_OUTCOME: ${{ steps.download_full.outcome }}
          DAILY_OUTCOME: ${{ steps.download_daily.outcome }}
        run: |
          if [ "$PROFILE" = "full" ]; then
            outcome="$FULL_OUTCOME"
          else
            outcome="$DAILY_OUTCOME"
          fi
          echo "Download profile: $PROFILE"
          echo "Download step outcome: ${outcome:-not-run}"

      - name: Check archive categories are canonical
        run: python scripts/check_canonical_categories.py --skills-dir skills

      - name: Normalize archive skill layout
        run: |
          python scripts/normalize_skill_depth.py \
            --skills-dir skills \
            --apply \
            --json \
            --output archive-depth-normalization-report.json

          python scripts/normalize_skill_depth.py \
            --skills-dir skills \
            --json \
            --output archive-depth-normalization-post-check.json

          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("archive-depth-normalization-report.json").read_text())
          post = json.loads(Path("archive-depth-normalization-post-check.json").read_text())
          print(
              "Archive layout normalization: "
              f"planned={report.get('move_count', 0)} "
              f"duplicates={report.get('duplicate_count', 0)} "
              f"same_key_conflicts={report.get('same_key_conflict_count', 0)}"
          )
          remaining = {
              key: int(post.get(key, 0) or 0)
              for key in (
                  "move_count",
                  "duplicate_count",
                  "same_key_conflict_count",
                  "same_key_preserved_count",
              )
          }
          if any(remaining.values()):
              raise SystemExit(f"Archive layout normalization left non-standard paths: {remaining}")
          PY

      - name: Upload archive layout normalization report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: archive-depth-normalization-report
          path: |
            archive-depth-normalization-report.json
            archive-depth-normalization-post-check.json
          if-no-files-found: ignore

      - name: Upload download failure report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: download-failure-report
          path: failure_report.json
          if-no-files-found: ignore

      - name: Upload discovery learning data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: discovery-learning-data
          path: |
            sources/learning/discovery_candidates.jsonl
            sources/learning/discovery_observations.jsonl
            sources/learning/discovery_priors.json
          if-no-files-found: ignore

      - name: Resolve security scope
        id: security_scope
        env:
          PROFILE: ${{ steps.discovery.outputs.profile }}
        run: |
          FILE_LIST="$RUNNER_TEMP/security-scan-files.txt"
          : > "$FILE_LIST"

          if [ "$PROFILE" = "full" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "file_list=$FILE_LIST" >> "$GITHUB_OUTPUT"
            echo "changed_count=0" >> "$GITHUB_OUTPUT"
            echo "Security scope: full"
            exit 0
          fi

          {
            git -C skills diff --name-only --diff-filter=AM || true
            git -C skills ls-files --others --exclude-standard || true
          } | sort -u > "$FILE_LIST"

          COUNT=$(wc -l < "$FILE_LIST" | tr -d '[:space:]')
          if [ -z "$COUNT" ]; then
            COUNT=0
          fi

          echo "mode=daily-incremental" >> "$GITHUB_OUTPUT"
          echo "file_list=$FILE_LIST" >> "$GITHUB_OUTPUT"
          echo "changed_count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Security scope: daily-incremental ($COUNT archive files)"

      - name: Security scan (skills full)
        if: steps.security_scope.outputs.mode == 'full'
        id: security_full
        run: |
          echo "🔒 Running full security scan on skills..."
          python scripts/security_scanner.py skills/ --quiet --output security-report.json

      - name: Security scan (skills daily incremental)
        if: steps.security_scope.outputs.mode != 'full'
        id: security_daily
        run: |
          echo "🔒 Running incremental security scan on changed skills..."
          python scripts/security_scanner.py \
            skills/ \
            --quiet \
            --output security-report.json \
            --file-list "${{ steps.security_scope.outputs.file_list }}"

      - name: ClamAV scan (skills full)
        if: steps.security_scope.outputs.mode == 'full'
        id: clamav_full
        run: |
          echo "🛡️ Running full ClamAV scan on skills..."
          clamscan --recursive --infected --log=clamav-report.txt skills

      - name: ClamAV scan (skills daily incremental)
        if: steps.security_scope.outputs.mode != 'full'
        id: clamav_daily
        run: |
          echo "🛡️ Running incremental ClamAV scan on changed skills..."
          CLAMAV_FILE_LIST="$RUNNER_TEMP/clamav-scan-files.txt"
          {
            git -C skills diff --name-only --diff-filter=AM || true
            git -C skills ls-files --others --exclude-standard || true
          } | sed 's#^#skills/#' | sort -u > "$CLAMAV_FILE_LIST"
          if [ ! -s "$CLAMAV_FILE_LIST" ]; then
            echo "No changed archive files for ClamAV scan." | tee clamav-report.txt
            exit 0
          fi
          clamscan --infected --log=clamav-report.txt --file-list "$CLAMAV_FILE_LIST"

      - name: Print security outcome
        if: always()
        env:
          MODE: ${{ steps.security_scope.outputs.mode }}
          CHANGED_COUNT: ${{ steps.security_scope.outputs.changed_count }}
          FULL_OUTCOME: ${{ steps.security_full.outcome }}
          DAILY_OUTCOME: ${{ steps.security_daily.outcome }}
          CLAMAV_FULL_OUTCOME: ${{ steps.clamav_full.outcome }}
          CLAMAV_DAILY_OUTCOME: ${{ steps.clamav_daily.outcome }}
        run: |
          if [ "$MODE" = "full" ]; then
            outcome="$FULL_OUTCOME"
            clamav_outcome="$CLAMAV_FULL_OUTCOME"
          else
            outcome="$DAILY_OUTCOME"
            clamav_outcome="$CLAMAV_DAILY_OUTCOME"
          fi
          echo "Security mode: ${MODE:-unknown}"
          if [ "$MODE" != "full" ]; then
            echo "Security changed files: ${CHANGED_COUNT:-0}"
          fi
          echo "Security scan outcome: ${outcome:-not-run}"
          echo "ClamAV scan outcome: ${clamav_outcome:-not-run}"

      - name: Resolve metadata scope
        id: metadata_scope
        run: |
          FILE_LIST="$RUNNER_TEMP/metadata-scan-files.txt"
          : > "$FILE_LIST"

          {
            git -C skills diff --name-only --diff-filter=AM | grep -E '/(SKILL\.md|metadata\.json)$' || true
            git -C skills ls-files --others --exclude-standard | grep -E '/(SKILL\.md|metadata\.json)$' || true
          } | sed 's#^#skills/#' | sort -u > "$FILE_LIST"

          COUNT=$(wc -l < "$FILE_LIST" | tr -d '[:space:]')
          if [ -z "$COUNT" ]; then
            COUNT=0
          fi

          echo "file_list=$FILE_LIST" >> "$GITHUB_OUTPUT"
          echo "changed_count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Metadata scope changed files: $COUNT"

      - name: Metadata compliance scan (changed skills)
        run: |
          echo "📜 Running metadata attribution/license compliance scan (advisory, non-blocking)..."
          python scripts/check_metadata_compliance.py \
            --skills-dir skills \
            --metadata-schema schema/metadata.schema.json \
            --file-list "${{ steps.metadata_scope.outputs.file_list }}" \
            --output-json metadata-compliance-report.json \
            --notices THIRD_PARTY_NOTICES.generated.md \
            --report-only

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-report
          path: security-report.json

      - name: Upload ClamAV report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: clamav-report
          path: clamav-report.txt
          if-no-files-found: ignore

      - name: Upload metadata compliance report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: metadata-compliance-report
          path: |
            metadata-compliance-report.json
            THIRD_PARTY_NOTICES.generated.md

      - name: Validate sync pipeline health
        env:
          PROFILE: ${{ steps.discovery.outputs.profile }}
          DISCOVER_FULL_OUTCOME: ${{ steps.discover_full.outcome }}
          DISCOVER_DAILY_OUTCOME: ${{ steps.discover_daily.outcome }}
          DOWNLOAD_FULL_OUTCOME: ${{ steps.download_full.outcome }}
          DOWNLOAD_DAILY_OUTCOME: ${{ steps.download_daily.outcome }}
          SECURITY_MODE: ${{ steps.security_scope.outputs.mode }}
          SECURITY_FULL_OUTCOME: ${{ steps.security_full.outcome }}
          SECURITY_DAILY_OUTCOME: ${{ steps.security_daily.outcome }}
        run: |
          if [ "$PROFILE" = "full" ]; then
            discovery_outcome="$DISCOVER_FULL_OUTCOME"
            download_outcome="$DOWNLOAD_FULL_OUTCOME"
          else
            discovery_outcome="$DISCOVER_DAILY_OUTCOME"
            download_outcome="$DOWNLOAD_DAILY_OUTCOME"
          fi

          if [ "$SECURITY_MODE" = "full" ]; then
            security_outcome="$SECURITY_FULL_OUTCOME"
          else
            security_outcome="$SECURITY_DAILY_OUTCOME"
          fi

          python scripts/check_sync_pipeline_health.py \
            --discovery-outcome "${discovery_outcome:-not-run}" \
            --download-outcome "${download_outcome:-not-run}" \
            --security-outcome "${security_outcome:-not-run}" \
            --security-report security-report.json \
            --require-security-report

      - name: Copy security report to docs
        run: |
          if [ -f security-report.json ]; then
            cp security-report.json docs/security-report.json
          else
            echo "::warning::security-report.json missing; skip docs copy."
          fi

      - name: Rebuild registry.json from archive
        run: |
          python scripts/rebuild_registry.py --skills-dir skills --registry registry.json --skip-categories

      - name: Check registry categories are canonical
        run: python scripts/check_canonical_categories.py --registry-shards registry-shards

      - name: Build registry summary
        run: |
          python scripts/build_registry_summary.py \
            --registry registry.json \
            --plugins sources/plugins.json \
            --output registry_summary.json

      - name: Check generated artifact sizes
        run: |
          python scripts/check_generated_file_sizes.py \
            --root . \
            --include registry.json \
            --include registry-shards \
            --include docs \
            --limit 12

      - name: Commit & push data repo changes
        run: |
          cd skills
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A

          if git diff --staged --quiet; then
            echo "No data repo changes"
          else
            git commit -m "chore: update skills archive $(date -u +%Y-%m-%d)"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                echo "Data push succeeded on attempt $attempt"
                break
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "Data push failed (attempt $attempt), rebasing and retrying..."
                git fetch origin main
                if ! git rebase origin/main; then
                  git rebase --abort || true
                  echo "Data rebase failed; aborting push."
                  exit 1
                fi
              else
                echo "Data push failed after 3 attempts."
                exit 1
              fi
            done
          fi

      - name: Commit & push core metadata changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add registry.json registry_summary.json registry-manifest.json registry-shards/ sources/ CHANGELOG.md scripts/ schema/ README.md SECURITY.md LICENSE THIRD_PARTY_NOTICES.md .github/workflows/sync-data.yml .github/workflows/metadata-compliance.yml

          if git diff --staged --quiet; then
            echo "No core changes"
          else
            COUNT=$(python3 -c "import json; print(json.load(open('registry_summary.json')).get('total_count', 0))")
            git commit -m "chore: sync registry ($COUNT skills) $(date -u +%Y-%m-%d)"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                echo "Core push succeeded on attempt $attempt"
                break
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "Core push failed (attempt $attempt), rebasing and retrying..."
                git fetch origin main
                if ! git rebase origin/main; then
                  git rebase --abort || true
                  echo "Core rebase failed; aborting push."
                  exit 1
                fi
              else
                echo "Core push failed after 3 attempts."
                exit 1
              fi
            done
          fi

      - name: Capture source SHAs
        id: refs
        run: |
          echo "core_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "data_sha=$(git -C skills rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build immutable publish handoff
        env:
          RUN_ID: ${{ github.run_id }}
          CORE_REPO: ${{ github.repository }}
          CORE_SHA: ${{ steps.refs.outputs.core_sha }}
          DATA_REPO: ${{ vars.REGISTRY_DATA_REPO }}
          DATA_SHA: ${{ steps.refs.outputs.data_sha }}
          REGISTRY_MAIN_REPO: ${{ vars.REGISTRY_MAIN_REPO }}
        run: |
          mkdir -p sync-publish-handoff
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          sha_pattern = re.compile(r"[0-9a-f]{40}")
          core_sha = os.environ["CORE_SHA"]
          data_sha = os.environ["DATA_SHA"]
          if not sha_pattern.fullmatch(core_sha) or not sha_pattern.fullmatch(data_sha):
              raise SystemExit("Cannot build handoff from invalid source SHA")

          payload = {
              "event_type": "publish_from_core",
              "client_payload": {
                  "core_repo": os.environ["CORE_REPO"],
                  "core_sha": core_sha,
                  "data_repo": os.environ["DATA_REPO"],
                  "data_sha": data_sha,
              },
          }
          root = Path("sync-publish-handoff")
          payload_path = root / "publish-dispatch-payload.json"
          payload_bytes = (json.dumps(payload, separators=(",", ":")) + "\n").encode()
          payload_path.write_bytes(payload_bytes)
          evidence = {
              "schema_version": 1,
              "run_id": os.environ["RUN_ID"],
              "run_attempt": 1,
              "target_repo": os.environ["REGISTRY_MAIN_REPO"],
              "core_repo": os.environ["CORE_REPO"],
              "core_sha": core_sha,
              "data_repo": os.environ["DATA_REPO"],
              "data_sha": data_sha,
              "event_type": "publish_from_core",
              "payload_sha256": hashlib.sha256(payload_bytes).hexdigest(),
          }
          (root / "publish-dispatch-evidence.json").write_text(
              json.dumps(evidence, indent=2) + "\n", encoding="utf-8"
          )
          print(
              "Prepared immutable publish handoff "
              f"core={core_sha} data={data_sha} hash={evidence['payload_sha256']}"
          )
          PY

      - name: Upload immutable publish handoff
        uses: actions/upload-artifact@v7
        with:
          name: sync-publish-handoff
          path: sync-publish-handoff/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [preflight, sync]
    if: >-
      ${{
        always() &&
        needs.preflight.result == 'success' &&
        (needs.sync.result == 'success' ||
          (github.run_attempt > 1 && needs.sync.result == 'skipped'))
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Download immutable publish handoff
        uses: actions/download-artifact@v7
        with:
          # No run-id/repository override: restore only from this workflow run.
          name: sync-publish-handoff
          path: sync-publish-handoff

      - name: Validate immutable publish handoff
        id: handoff
        env:
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_CORE_REPO: ${{ github.repository }}
          EXPECTED_DATA_REPO: ${{ vars.REGISTRY_DATA_REPO }}
          EXPECTED_TARGET_REPO: ${{ vars.REGISTRY_MAIN_REPO }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          root = Path("sync-publish-handoff")
          payload_path = root / "publish-dispatch-payload.json"
          evidence_path = root / "publish-dispatch-evidence.json"
          if not payload_path.is_file() or not evidence_path.is_file():
              raise SystemExit("Publish handoff is missing required files")
          payload_bytes = payload_path.read_bytes()
          payload = json.loads(payload_bytes)
          evidence = json.loads(evidence_path.read_text(encoding="utf-8"))
          payload_keys = {"event_type", "client_payload"}
          client_keys = {"core_repo", "core_sha", "data_repo", "data_sha"}
          evidence_keys = {
              "schema_version", "run_id", "run_attempt", "target_repo", "core_repo",
              "core_sha", "data_repo", "data_sha", "event_type", "payload_sha256",
          }
          if set(payload) != payload_keys or set(payload.get("client_payload", {})) != client_keys:
              raise SystemExit("Publish payload has unexpected or missing fields")
          if set(evidence) != evidence_keys:
              raise SystemExit("Publish evidence has unexpected or missing fields")
          expected = {
              "schema_version": 1,
              "run_id": os.environ["EXPECTED_RUN_ID"],
              "run_attempt": 1,
              "target_repo": os.environ["EXPECTED_TARGET_REPO"],
              "core_repo": os.environ["EXPECTED_CORE_REPO"],
              "data_repo": os.environ["EXPECTED_DATA_REPO"],
              "event_type": "publish_from_core",
          }
          for key, value in expected.items():
              if evidence.get(key) != value:
                  raise SystemExit(f"Publish evidence mismatch: {key}")
          client = payload["client_payload"]
          for key in client_keys:
              if client.get(key) != evidence.get(key):
                  raise SystemExit(f"Publish payload/evidence mismatch: {key}")
          if payload["event_type"] != evidence["event_type"]:
              raise SystemExit("Publish event_type mismatch")
          if not re.fullmatch(r"[0-9a-f]{40}", evidence["core_sha"]):
              raise SystemExit("Invalid publish core SHA")
          if not re.fullmatch(r"[0-9a-f]{40}", evidence["data_sha"]):
              raise SystemExit("Invalid publish data SHA")
          if hashlib.sha256(payload_bytes).hexdigest() != evidence["payload_sha256"]:
              raise SystemExit("Publish payload hash mismatch")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for key in ("target_repo", "core_sha", "data_sha", "payload_sha256"):
                  output.write(f"{key}={evidence[key]}\n")
          print(f"Validated immutable publish handoff ({evidence['payload_sha256']})")
          PY

      - name: Dispatch main publish workflow from immutable handoff
        env:
          MAIN_REPO_TOKEN: ${{ secrets.MAIN_REPO_TOKEN }}
          TARGET_REPO: ${{ steps.handoff.outputs.target_repo }}
          CORE_SHA: ${{ steps.handoff.outputs.core_sha }}
          DATA_SHA: ${{ steps.handoff.outputs.data_sha }}
          PAYLOAD_SHA256: ${{ steps.handoff.outputs.payload_sha256 }}
        run: |
          set -euo pipefail
          PAYLOAD_FILE="sync-publish-handoff/publish-dispatch-payload.json"
          if ! curl --fail-with-body -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $MAIN_REPO_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/$TARGET_REPO/dispatches" \
              --data-binary "@$PAYLOAD_FILE"; then
            {
              echo "## Publish dispatch failed"
              echo ""
              echo "- target_repo: $TARGET_REPO"
              echo "- core_sha: $CORE_SHA"
              echo "- data_sha: $DATA_SHA"
              echo "- payload_sha256: $PAYLOAD_SHA256"
              echo ""
              echo "Replay payload:"
              cat "$PAYLOAD_FILE"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Publish dispatch failed: target=$TARGET_REPO core=$CORE_SHA data=$DATA_SHA hash=$PAYLOAD_SHA256"
            cat "$PAYLOAD_FILE"
            exit 1
          fi
          echo "Dispatched publish: $TARGET_REPO (core=$CORE_SHA data=$DATA_SHA hash=$PAYLOAD_SHA256)"

      - name: Dispatch build-index to refresh Pages
        env:
          MAIN_REPO_TOKEN: ${{ secrets.MAIN_REPO_TOKEN }}
        run: |
          curl --fail-with-body -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $MAIN_REPO_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/build-index.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "Dispatched build-index for Pages refresh"
